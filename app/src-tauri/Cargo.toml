[package]
name = "adbcp-app"
version = "0.4.0"
description = "Desktop app for the adbcp copy engine"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
trash = "5"
adbcp-mtp = { path = "../../mtp" }
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
